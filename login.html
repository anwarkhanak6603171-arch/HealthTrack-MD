<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Portal | HealthTrack MD</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 3rem;
            text-align: center;
        }
        .login-logo {
            font-size: 3rem;
            color: var(--accent);
            margin-bottom: 1rem;
        }
        .login-card h2 {
            margin-bottom: 2rem;
            font-weight: 700;
        }
        .error-msg {
            background: rgba(231, 29, 54, 0.2);
            color: var(--danger);
            padding: 0.75rem;
            border-radius: 10px;
            margin-bottom: 1rem;
            display: none;
            font-size: 0.875rem;
        }
        .info-msg {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 1.5rem;
        }
    </style>
</head>
<body>
    <div class="glass-bg"></div>
    <div class="login-container">
        <div class="login-card glass">
            <div class="login-logo"><i class="fas fa-user-md"></i></div>
            <h2>HealthTrack <span>MD</span></h2>
            <div id="error-box" class="error-msg">Invalid credentials</div>
            <form id="login-form">
                <div class="form-group" style="text-align: left;">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Doctor Username" required>
                </div>
                <div class="form-group" style="text-align: left;">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-submit" style="margin-top: 1rem;">Authorize Access</button>
            </form>
            <p class="info-msg">Secure access for authorized medical personnel only.</p>
            <p class="info-msg" style="margin-top: 0.5rem;">New doctor? <a href="register.html" style="color: var(--accent); text-decoration: none; font-weight: 600;">Create an account</a></p>
        </div>
    </div>

    <script>
        const API_BASE = '';
        const loginForm = document.getElementById('login-form');
        const errorBox = document.getElementById('error-box');

        loginForm.onsubmit = async (e) => {
            e.preventDefault();
            errorBox.style.display = 'none';

            const formData = new FormData(loginForm);
            const params = new URLSearchParams();
            for (const pair of formData) {
                params.append(pair[0], pair[1]);
            }

            try {
                const response = await fetch(`${API_BASE}/token`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: params
                });

                if (response.ok) {
                    const data = await response.json();
                    localStorage.setItem('doctor_token', data.access_token);
                    localStorage.setItem('doctor_username', formData.get('username'));
                    window.location.href = 'index.html';
                } else {
                    errorBox.style.display = 'block';
                }
            } catch (error) {
                console.error('Login error:', error);
                errorBox.textContent = 'Server connection failed';
                errorBox.style.display = 'block';
            }
        };
    </script>
</body>
</html>
